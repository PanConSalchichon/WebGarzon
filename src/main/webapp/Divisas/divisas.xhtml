<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Conversor COP - USD</title>
</h:head>

<h:body>

    <h:form id="formConversor">

        <p:panel header="Conversor de Divisas COP - USD">

            <p:messages id="mensajes" showDetail="true" closable="true"/>

            <p:panelGrid columns="2" style="width:100%">

                <h:outputLabel for="monto" value="Monto a convertir:"/>
                <p:inputNumber id="monto"
                               value="#{conversionBean.monto}"
                               minValue="0.01"
                               decimalPlaces="2"
                               thousandSeparator=","
                               decimalSeparator="."
                               placeholder="Ingrese el monto"
                               required="true"
                               requiredMessage="El monto es obligatorio">
                    <f:validateRequired/>
                </p:inputNumber>

                <h:outputLabel for="divisa" value="Convertir de:"/>
                <p:selectOneMenu id="divisa"
                                 value="#{conversionBean.divisaOrigen}">
                    <f:selectItems value="#{conversionBean.divisasDisponibles}"
                                   var="d"
                                   itemLabel="#{d}"
                                   itemValue="#{d}"/>
                    <p:ajax update="divisaDestino"/>
                </p:selectOneMenu>

                <h:outputLabel value="Divisa destino:"/>
                <h:outputText id="divisaDestino"
                              value="#{conversionBean.divisaDestinoLabel}"
                              style="font-weight:bold;"/>

                <h:outputLabel value="Tasa de cambio:"/>
                <h:outputText value="1 USD = #{conversionBean.tasaActual} COP"/>

            </p:panelGrid>

            <p:separator/>

            <p:commandButton value="Convertir"
                             icon="pi pi-refresh"
                             action="#{conversionBean.convertir}"
                             update="panelResultado panelHistorial mensajes"
                             style="margin-right:8px;"/>

            <h:outputLink value="index.html" style="margin-left:8px;">
                <p:button value="Volver al Menu" icon="pi pi-home" type="button"/>
            </h:outputLink>

        </p:panel>

        <p:separator/>

        <p:outputPanel id="panelResultado">
            <p:panel header="Resultado" rendered="#{conversionBean.ultimaConversion != null}">
                <p:panelGrid columns="2">

                    <h:outputLabel value="Monto origen:"/>
                    <h:outputText value="#{conversionBean.ultimaConversion.montoOrigen}">
                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" groupingUsed="true"/>
                    </h:outputText>

                    <h:outputLabel value="Divisa origen:"/>
                    <h:outputText value="#{conversionBean.ultimaConversion.divisaOrigen}"/>

                    <h:outputLabel value="Resultado:"/>
                    <h:outputText value="#{conversionBean.ultimaConversion.montoDestino}">
                        <f:convertNumber minFractionDigits="2" maxFractionDigits="2" groupingUsed="true"/>
                    </h:outputText>

                    <h:outputLabel value="Divisa destino:"/>
                    <h:outputText value="#{conversionBean.ultimaConversion.divisaDestino}"/>

                    <h:outputLabel value="Tasa aplicada:"/>
                    <h:outputText value="1 USD = #{conversionBean.ultimaConversion.tasaAplicada} COP"/>

                </p:panelGrid>
            </p:panel>
        </p:outputPanel>

        <p:separator/>

        <p:outputPanel id="panelHistorial">
            <p:panel header="Ultimas 5 conversiones de la sesion"
                     rendered="#{not empty conversionBean.historial}">
                <p:dataTable value="#{conversionBean.historial}" var="conv">

                    <p:column headerText="Hora">
                        <h:outputText value="#{conv.fechaHora}">
                            <f:convertDateTime pattern="HH:mm:ss" type="localDateTime"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="De">
                        <h:outputText value="#{conv.divisaOrigen}"/>
                    </p:column>

                    <p:column headerText="Monto origen">
                        <h:outputText value="#{conv.montoOrigen}">
                            <f:convertNumber minFractionDigits="2" maxFractionDigits="2" groupingUsed="true"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="A">
                        <h:outputText value="#{conv.divisaDestino}"/>
                    </p:column>

                    <p:column headerText="Resultado">
                        <h:outputText value="#{conv.montoDestino}">
                            <f:convertNumber minFractionDigits="2" maxFractionDigits="2" groupingUsed="true"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Tasa">
                        <h:outputText value="#{conv.tasaAplicada}"/>
                    </p:column>

                </p:dataTable>
            </p:panel>
        </p:outputPanel>

    </h:form>

</h:body>
</html>
