    <style>
        body {
            font-family: Segoe UI, Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 40px 20px;
            color: #37474f;
        }
        .contenedor {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 36px 40px;
        }
        h1 {
            color: #1a237e;
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 8px;
            border-bottom: 3px solid #1a237e;
            padding-bottom: 10px;
        }
        .subtitulo {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 28px;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        ul li {
            margin-bottom: 10px;
        }
        ul li a {
            display: block;
            padding: 12px 18px;
            background-color: #e8eaf6;
            color: #1a237e;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            border-left: 4px solid #1a237e;
            transition: background 0.2s;
        }
        ul li a:hover {
            background-color: #c5cae9;
        }
        ul li.nuevo a {
            background-color: #e8f5e9;
            color: #1b5e20;
            border-left: 4px solid #1b5e20;
        }
        ul li.nuevo a:hover {
            background-color: #c8e6c9;
        }
        .badge {
            display: inline-block;
            background: #1b5e20;
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 7px;
            border-radius: 10px;
            margin-left: 8px;
            vertical-align: middle;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        footer {
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid #e0e0e0;
            font-size: 0.82rem;
            color: #999;
            text-align: center;
        }
